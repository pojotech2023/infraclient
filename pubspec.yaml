  custom_ui:
    path: ../custom_ui


  freezed_annotation: ^2.4.4
  json_annotation: ^4.8.1



dev_dependencies:
  flutter_test:
    sdk: flutter

  integration_test:
    sdk: flutter

  # ðŸ› ï¸ Linting
  flutter_lints: ^3.0.1

  # ðŸš€ Code Generators
  build_runner: ^2.4.10
  freezed: ^2.5.2
  json_serializable: ^6.8.0


flutter:
  uses-material-design: true

  # Enable generation of localized strings from arb files
  generate: true

  assets:
    - assets/images/svg_images/
    - assets/images/png_images/
    - assets/responses/
    - assets/translations/
    - assets/env/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Medium.ttf
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-SemiBold.ttf
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Bold.ttf

    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/noto_naskh_arabic/NotoNaskhArabic-Regular.ttf
        - asset: assets/fonts/noto_naskh_arabic/NotoNaskhArabic-Medium.ttf
        - asset: assets/fonts/noto_naskh_arabic/NotoNaskhArabic-SemiBold.ttf
        - asset: assets/fonts/noto_naskh_arabic/NotoNaskhArabic-Bold.ttf

