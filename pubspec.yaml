  # ðŸ”„ State Management
  flutter_bloc: ^9.1.1
  get_it: ^7.7.0


  # ðŸ›¤ï¸ Navigation
  go_router: ^16.2.1

  # ðŸ’¾ Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0

  # ðŸŒ Environment Variables
  flutter_dotenv: ^6.0.0

  # ðŸŒ Internationalization
  intl: ^0.20.2

  # ðŸ”— API & Data Handling
  http: ^1.2.1
  dartz: ^0.10.1
  connectivity_plus: ^6.0.3


  # ðŸ“ Location & Maps
  google_maps_flutter: ^2.6.0

  # ðŸ”” Notifications
  flutter_local_notifications: ^17.2.3

